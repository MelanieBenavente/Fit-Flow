plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // Add the Crashlytics Gradle plugin
    id 'com.google.firebase.crashlytics'
    // Add the Google services Gradle plugin
    id 'com.google.gms.google-services'
    // Dagger-Hilt
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'com.fit.fitndflow'
    compileSdk 34

    defaultConfig {
        applicationId "com.fit.fitndflow"
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName "1.6-2024-07-26-01"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    viewBinding{
        enabled = true
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    //modules
    implementation project (':ui-layer')
    implementation project(':domain:common-domain')
    implementation project(':domain:categories-domain')
    implementation project(':domain:exercises-domain')
    implementation project(':domain:trainings-domain')
    implementation project(':domain:user-domain')
    implementation project(':data:common-data')
    implementation project(':data:categories-data')
    implementation project(':data:exercises-data')
    implementation project(':data:trainings-data')
    implementation project(':data:user-data')
    
    //layout for splashActivity
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Import the BoM for the Firebase platform
    implementation platform('com.google.firebase:firebase-bom:32.1.0')

    // Add the dependencies for the Crashlytics and Analytics libraries
    // When using the BoM, you don't specify versions in Firebase library dependencies
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'

    // Dagger-Hilt
    implementation "com.google.dagger:hilt-android:2.51.1"
    kapt "com.google.dagger:hilt-compiler:2.51.1"

    //Room
    implementation "androidx.room:room-ktx:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"

    //compose
    implementation 'androidx.activity:activity-compose:1.8.2'

    //testing
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation "io.mockk:mockk:1.13.3"
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.0'
    testImplementation 'app.cash.turbine:turbine-jvm:1.0.0'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:1.9.10'


}
// Allow references to generated code (dagger-hilt)
kapt {
    correctErrorTypes true
}